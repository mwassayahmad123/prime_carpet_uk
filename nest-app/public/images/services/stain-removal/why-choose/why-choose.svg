<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2d45"/>
      <stop offset="100%" stop-color="#0f1c2e"/>
    </linearGradient>
    <linearGradient id="stainFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a3b2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7a3b2e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <ellipse cx="400" cy="490" rx="240" ry="24" fill="#0f1c2e" opacity="0.08"/>

  <!-- fabric swatch -->
  <rect x="210" y="180" width="380" height="280" rx="20" fill="url(#fabric)"/>
  <g stroke="#28405f" stroke-width="2" opacity="0.6">
    <line x1="210" y1="220" x2="590" y2="220"/>
    <line x1="210" y1="260" x2="590" y2="260"/>
    <line x1="210" y1="300" x2="590" y2="300"/>
    <line x1="210" y1="340" x2="590" y2="340"/>
    <line x1="210" y1="380" x2="590" y2="380"/>
    <line x1="210" y1="420" x2="590" y2="420"/>
  </g>

  <!-- stain fading to clean -->
  <path d="M240 260 q40 -50 90 -20 q50 20 40 70 q-10 50 -70 55 q-60 5 -80 -40 q-15 -35 20 -65 z" fill="url(#stainFade)"/>

  <!-- spray bottle -->
  <g transform="translate(330,120)">
    <rect x="-14" y="30" width="28" height="55" rx="8" fill="#c9a84c"/>
    <rect x="-8" y="10" width="16" height="24" rx="4" fill="#0f1c2e"/>
    <rect x="-4" y="-6" width="8" height="18" rx="3" fill="#0f1c2e"/>
    <g stroke="#c9a84c" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="14" y1="-6" x2="30" y2="-16"/>
      <line x1="18" y1="4" x2="36" y2="0"/>
      <line x1="14" y1="14" x2="32" y2="18"/>
    </g>
  </g>

  <!-- droplets over stain -->
  <g fill="#c9a84c" opacity="0.85">
    <circle cx="300" cy="230" r="6"/>
    <circle cx="325" cy="215" r="5"/>
    <circle cx="350" cy="235" r="6"/>
  </g>

  <!-- clean checkmark area accent -->
  <g fill="#c9a84c" opacity="0.9">
    <path d="M470 300 l14 14 l28 -30" fill="none" stroke="#c9a84c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity="0.85">
    <path d="M180 200 q-14 -22 0 -44 q14 22 0 44 z" fill="#c9a84c" opacity="0.5"/>
    <path d="M620 200 q-14 -22 0 -44 q14 22 0 44 z" fill="#c9a84c" opacity="0.5"/>
  </g>

  <g fill="#c9a84c">
    <path d="M630 150 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M175 470 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" opacity="0.8"/>
  </g>

  <g transform="translate(600,440)">
    <circle cx="0" cy="0" r="42" fill="#ffffff"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#c9a84c" stroke-width="4"/>
    <path d="M-16 1 l10 11 l24 -26" fill="none" stroke="#0f1c2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
