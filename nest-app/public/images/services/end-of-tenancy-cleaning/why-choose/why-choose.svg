<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="house" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2d45"/>
      <stop offset="100%" stop-color="#0f1c2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <ellipse cx="400" cy="500" rx="240" ry="24" fill="#0f1c2e" opacity="0.08"/>

  <!-- house body -->
  <rect x="240" y="260" width="320" height="220" rx="12" fill="url(#house)"/>
  <!-- roof -->
  <path d="M210 270 L400 140 L590 270 Z" fill="#0f1c2e"/>
  <path d="M210 270 L400 140 L590 270" fill="none" stroke="#c9a84c" stroke-width="6" stroke-linejoin="round"/>

  <!-- windows -->
  <rect x="270" y="300" width="70" height="70" rx="8" fill="#eef1f6" opacity="0.9"/>
  <line x1="305" y1="300" x2="305" y2="370" stroke="#0f1c2e" stroke-width="4"/>
  <line x1="270" y1="335" x2="340" y2="335" stroke="#0f1c2e" stroke-width="4"/>

  <rect x="460" y="300" width="70" height="70" rx="8" fill="#eef1f6" opacity="0.9"/>
  <line x1="495" y1="300" x2="495" y2="370" stroke="#0f1c2e" stroke-width="4"/>
  <line x1="460" y1="335" x2="530" y2="335" stroke="#0f1c2e" stroke-width="4"/>

  <!-- door -->
  <rect x="365" y="390" width="70" height="90" rx="6" fill="#c9a84c"/>
  <circle cx="420" cy="435" r="5" fill="#0f1c2e"/>

  <!-- key -->
  <g transform="translate(430,220) rotate(25)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#c9a84c" stroke-width="8"/>
    <rect x="16" y="-6" width="46" height="12" fill="#c9a84c"/>
    <rect x="48" y="6" width="10" height="14" fill="#c9a84c"/>
    <rect x="34" y="6" width="10" height="10" fill="#c9a84c"/>
  </g>

  <g opacity="0.85">
    <path d="M190 220 q-14 -22 0 -44 q14 22 0 44 z" fill="#c9a84c" opacity="0.5"/>
    <path d="M610 220 q-14 -22 0 -44 q14 22 0 44 z" fill="#c9a84c" opacity="0.5"/>
  </g>

  <g fill="#c9a84c">
    <path d="M630 320 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M175 420 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" opacity="0.8"/>
  </g>

  <g transform="translate(600,450)">
    <circle cx="0" cy="0" r="42" fill="#ffffff"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#c9a84c" stroke-width="4"/>
    <path d="M-16 1 l10 11 l24 -26" fill="none" stroke="#0f1c2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
